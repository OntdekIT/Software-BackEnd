# Local development without hot reload of the frontend (referenced from Software-Documents).
# Copy .env.example to .env first.
name: climatechecker-dev

services:
  db:
    # Pinned to 11.2: newer 11.x (e.g. 11.8) is not supported by Flyway 10.10
    # and breaks the migration connection on startup.
    image: mariadb:11.2
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?set SPRING_DATASOURCE_PASSWORD in .env}
      MYSQL_DATABASE: ${SPRING_DATASOURCE_SCHEME:?set SPRING_DATASOURCE_SCHEME in .env}
      # Passwordless localhost/socket user so healthcheck.sh --connect can reach
      # the server; without it the check is denied and the container never
      # becomes healthy, blocking dependents from starting.
      MARIADB_MYSQL_LOCALHOST_USER: "1"
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  smtp:
    image: mailserver/docker-mailserver:15.0.0
    restart: unless-stopped
    hostname: mail
    domainname: example.com
    environment:
      MAILSERVER_RELAY_HOST: ${MAILSERVER_RELAY_HOST}
      MAILSERVER_RELAY_PORT: ${MAILSERVER_RELAY_PORT}
      MAILSERVER_RELAY_USER: ${MAILSERVER_RELAY_USER}
      MAILSERVER_RELAY_PASSWORD: ${MAILSERVER_RELAY_PASSWORD}
    ports:
      - "127.0.0.1:25:25"
      - "127.0.0.1:587:587"
      - "127.0.0.1:993:993"

  backend:
    build: .
    image: climatechecker-springboot:dev
    restart: unless-stopped
    environment:
      # dev profile: allows the built-in dev JWT key (see README, JWT_SECRET per omgeving)
      SPRING_PROFILES_ACTIVE: docker,dev
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:mariadb://db:3306/${SPRING_DATASOURCE_SCHEME}}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-root}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      MAILSERVER_RELAY_HOST: ${MAILSERVER_RELAY_HOST}
      MAILSERVER_RELAY_PORT: ${MAILSERVER_RELAY_PORT}
      USE_REAL_MAILSERVER: ${USE_REAL_MAILSERVER:-false}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      ROOT_USER_FIRSTNAME: ${ROOT_USER_FIRSTNAME}
      ROOT_USER_LASTNAME: ${ROOT_USER_LASTNAME}
      ROOT_USER_EMAIL: ${ROOT_USER_EMAIL}
      ROOT_USER_PASSWORD: ${ROOT_USER_PASSWORD}
      FRONTEND_HOST: ${FRONTEND_HOST:-http://localhost:5173}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000}
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8082/actuator/health/readiness"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ../../Software-FrontEnd/
      dockerfile: Dockerfile
      target: dev
    image: climatechecker-frontend:dev
    environment:
      VITE_BACKEND_API_URL: ${VITE_BACKEND_API_URL}
    ports:
      - "5173:5173"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db_data:
