# Disable rate limiting during tests to avoid interference with repeated requests
rate.limit.enabled=false

# Use an in-memory H2 database during tests (the Flyway migration is MySQL/MariaDB-specific)
# NON_KEYWORDS=USER prevents H2 from treating "user" as a reserved keyword
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=USER
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.flyway.enabled=false

# Default values for the root user seeder in tests
application.root-user.first-name=Admin
application.root-user.last-name=User
application.root-user.email=admin@example.com
application.root-user.password=password

# Frontend host used in password reset and other emails
frontend.host=http://localhost:5173

# In-memory GreenMail mail server configuration for tests
# These values are used when USE_REAL_MAILSERVER is not set to true
use.real.mailserver=false
spring.mail.host=localhost
spring.mail.port=3025
spring.mail.username=test@localhost
spring.mail.password=test
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
