server.port=8082
spring.jpa.hibernate.ddl-auto=validate

# Meet je stad databron. Override met de env-var MEETJESTAD_BASE_URL of deze
# property om zonder codewijziging naar een andere bron (demo/test/live) te wijzen.
meetjestad.base-url=${MEETJESTAD_BASE_URL:https://meetjestad.net/data/?type=sensors&format=json}

# Intervallen van de StationMonitorService (in seconden). Instelbaar zonder
# codewijziging. Uitvalcontrole default 5 min (300s), dataophalen default 6 uur
# (21600s). Definitieve waarden nog af te stemmen met de opdrachtgever.
station.monitor.downtime-check-interval-seconds=${STATION_DOWNTIME_CHECK_INTERVAL_SECONDS:300}
station.monitor.measurement-fetch-interval-seconds=${STATION_MEASUREMENT_FETCH_INTERVAL_SECONDS:21600}

# Pepper voor het hashen van vertrouwde IP-adressen (trusted-IP whitelist).
# MOET in elke niet-lokale omgeving via de env-var TRUSTED_IP_PEPPER gezet
# worden; de fallback is een wegwerpwaarde voor lokaal.
application.trusted-ip.pepper=${TRUSTED_IP_PEPPER:dev-only-trusted-ip-pepper-change-me}

# Only expose the health actuator endpoint; keep env/beans/mappings/etc off the
# public surface. Health details are hidden unless the caller is authorized.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized

# JWT signing key (Base64-encoded, min 256-bit). MUST be supplied via the
# JWT_SECRET environment variable in every non-local environment. The fallback
# below is a throwaway dev key only and must never be used in production.
application.jwt.secret=${JWT_SECRET:ZGV2LW9ubHktc2VjcmV0LWRvLW5vdC11c2UtaW4tcHJvZHVjdGlvbi1jaGFuZ2VtZQ==}

spring.mail.properties.mail.smtp.starttls.enable=true
application.timezone=UTC
frontend.host=http://localhost:5173

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mariadb://localhost:3306/your_database_name}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
spring.flyway.url=${SPRING_DATASOURCE_URL}
spring.flyway.user=${SPRING_DATASOURCE_USERNAME}
spring.flyway.password=${SPRING_DATASOURCE_PASSWORD}
spring.flyway.schemas=ontdekstation013

# Flag to switch between a real mail server and the test/in-memory mail server
use.real.mailserver=${USE_REAL_MAILSERVER:false}

spring.mail.host=${MAILSERVER_RELAY_HOST:localhost}
spring.mail.port=${MAILSERVER_RELAY_PORT:3025}
spring.mail.username=${MAIL_USERNAME:test@localhost}
spring.mail.password=${MAIL_PASSWORD:test}

application.root-user.first-name=${ROOT_USER_FIRSTNAME}
application.root-user.last-name=${ROOT_USER_LASTNAME}
application.root-user.email=${ROOT_USER_EMAIL}
application.root-user.password=${ROOT_USER_PASSWORD}

# Rate limiting configuration (Bucket4J)
rate.limit.enabled=true
rate.limit.requests-per-minute=20
