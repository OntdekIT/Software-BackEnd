name: CI build

# De enige build-en-test workflow: draait alle tests (ook de Testcontainers-
# integratietests, de runner heeft Docker) op JDK 21 en publiceert een rapport.
# Image bouwen/publiceren zit in ghcr.yml, analyse in sonarqube.yml, lint in
# super-linter.yml.
on:
  push:
    branches:
      - main
      - s3nj26
      - s3nj26_dev
  pull_request:
  workflow_dispatch:

# Een nieuwe push op dezelfde branch/PR annuleert de lopende run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: ClimateChecker

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: ClimateChecker/pom.xml

      - name: Build and test
        run: mvn -B --no-transfer-progress verify

      - name: Publish test report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Maven tests
          path: ClimateChecker/target/surefire-reports/*.xml
          reporter: java-junit
          fail-on-error: false

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: ClimateChecker/target/surefire-reports/
          if-no-files-found: ignore

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: climatechecker-jar
          path: ClimateChecker/target/*.jar
          retention-days: 7
          if-no-files-found: error
