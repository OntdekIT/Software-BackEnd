name: Sonar Scan

on:
  workflow_dispatch:
  push:
    branches:
      - "*"

jobs:
  build-and-analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Build Project
        run: mvn -B clean verify -DskipTests
        working-directory: ClimateChecker

      - name: Run SonarCloud Scan
        uses: sonarsource/sonarcloud-scan-action@v2.1.1
        with:
          projectBaseDir: ClimateChecker
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
