name: Super-Linter

on:
  pull_request:
    branches:
      - develop
      - main
      - "*"
  push:
    branches:
      - develop
      - main
      - "*"

jobs:
  lint:
    name: Lint Code Base
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Volledige historie zodat Super-Linter het verschil met de
          # base-branch kan berekenen en ALLEEN gewijzigde bestanden lint.
          # Zonder dit valt hij terug op de hele codebase.
          fetch-depth: 0

      - name: Run Super-Linter
        uses: github/super-linter@v5
        env:
          VALIDATE_ALL_CODEBASE: false
          # Diff tegen de actieve semester-branch i.p.v. main (die ver
          # achterloopt), anders wordt bijna de hele repo als 'gewijzigd' gezien.
          DEFAULT_BRANCH: s3nj26
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
