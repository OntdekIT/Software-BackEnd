name: Super-Linter

on:
  pull_request:
    branches:
      - develop
      - main
      - "*"
  push:
    branches:
      - develop
      - main
      - "*"

jobs:
  lint:
    name: Lint Code Base
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Super-Linter
        uses: github/super-linter@v5
        env:
          VALIDATE_ALL_CODEBASE: false
          # Java-checkstyle uitgezet: de standaardregels (Sun/Google-stijl) eisen
          # o.a. lowercase packagenamen, terwijl de root-package 'Ontdekstation013'
          # een hoofdletter heeft. Daardoor faalt élk Java-bestand op regels die
          # niet haalbaar zijn zonder de hele package-structuur te hernoemen; dat
          # is alleen ruis en verbergt echte problemen. De backend-code wordt via
          # SonarCloud + de Maven-build/tests gecontroleerd.
          VALIDATE_JAVA: false
          VALIDATE_JSON: true
          VALIDATE_YAML: true
          VALIDATE_MARKDOWN: true
          VALIDATE_DOCKERFILE: true
          VALIDATE_GITHUB_ACTIONS: true
          DEFAULT_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
